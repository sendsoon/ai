[project]
name = "sendsoon-mcp"
version = "0.3.5"
description = "MCP server for SendSoon: send email, look up public IP information, and convert files to Markdown from Codex and Claude."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SendSoon" }]
keywords = [
  "mcp",
  "model-context-protocol",
  "mcp-server",
  "sendsoon",
  "email",
  "ip-lookup",
  "markitdown",
  "claude",
  "cursor",
  "codex",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
]
dependencies = [
  "mcp>=1.2.0,<2",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/sendsoon/mcp"
Documentation = "https://github.com/sendsoon/mcp/tree/main/pypi"
Repository = "https://github.com/sendsoon/mcp"
Issues = "https://github.com/sendsoon/mcp/issues"

[project.scripts]
sendsoon-mcp = "sendsoon_mcp.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-httpx>=0.35",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sendsoon_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/sendsoon_mcp",
  "/tests",
  "/README.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src/sendsoon_mcp", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["sendsoon_mcp"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["sendsoon_mcp"]
mypy_path = "src"
explicit_package_bases = true
