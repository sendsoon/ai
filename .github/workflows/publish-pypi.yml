# Reusable PyPI publish workflow. Called from release.yml (parallel with npm).
# PyPI Trusted Publisher must match:
#   owner=sendsoon, repo=mcp, workflow=publish-pypi.yml, environment=pypi
#
# Standalone tag trigger (python-only release):
#   python-vX.Y.Z  → publish Python X.Y.Z
name: Publish PyPI package

on:
  workflow_call:
  workflow_dispatch:
  push:
    tags:
      - "python-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          case "$REF" in
            python-v*) VERSION="${REF#python-v}" ;;
            v*) VERSION="${REF#v}" ;;
            *) echo "unsupported tag: $REF"; exit 1 ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "resolved version=$VERSION"

      - name: Align version in pyproject.toml
        if: env.VERSION != ''
        run: |
          python <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          path = pathlib.Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(?m)^version = "[^"]+"$',
              f'version = "{version}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("failed to update version in pyproject.toml")
          path.write_text(updated, encoding="utf-8")
          print(f"pyproject version -> {version}")
          PY

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist-${{ github.run_id }}
          path: pypi/dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist-${{ github.run_id }}
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
          attestations: true
