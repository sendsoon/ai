# Publishes sendsoon-mcp to PyPI via Trusted Publishing (OIDC).
# PyPI pending publisher must match:
#   owner=sendsoon, repo=ai, workflow=publish-pypi.yml, environment=pypi
#
# Tag convention (keep in sync with npm):
#   python-vX.Y.Z  → publish Python X.Y.Z
#   vX.Y.Z         → also publish Python X.Y.Z (same number as npm tag)
name: Publish Python package

on:
  push:
    tags:
      - "python-v*"
      - "v*"
  workflow_dispatch:

jobs:
  build:
    # Avoid double-running on tags that are neither release forms.
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/python-v') ||
      (startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/python-v'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          case "$REF" in
            python-v*) VERSION="${REF#python-v}" ;;
            v*) VERSION="${REF#v}" ;;
            *) echo "unsupported tag: $REF"; exit 1 ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "resolved version=$VERSION"

      - name: Align version in pyproject.toml
        if: env.VERSION != ''
        run: |
          python <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          path = pathlib.Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(?m)^version = "[^"]+"$',
              f'version = "{version}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("failed to update version in pyproject.toml")
          path.write_text(updated, encoding="utf-8")
          print(f"pyproject version -> {version}")
          PY

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
          attestations: true
