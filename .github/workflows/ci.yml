name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assert package versions match
        run: |
          NPM="$(node -p "require('./npm/package.json').version")"
          PY="$(python3 -c "import re,pathlib; t=pathlib.Path('pypi/pyproject.toml').read_text(); print(re.search(r'(?m)^version = \"([^\"]+)\"$', t).group(1))")"
          SV="$(node -p "require('./server.json').version")"
          test "$NPM" = "$PY" && test "$NPM" = "$SV"
      - run: pnpm run check

  pypi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]" build twine
      - run: ruff check src tests
      - run: mypy
      - run: pytest
      - run: python -m build
      - run: twine check dist/*
