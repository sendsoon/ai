# Publish @sendsoon/mcp to npm. Runs in parallel with publish-pypi.yml on v* tags.
# npm Trusted Publisher: sendsoon/mcp → publish-npm.yml (environment: npm)
name: Publish npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          export VERSION
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = process.env.VERSION;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          console.log('npm version ->', process.env.VERSION);
          NODE
      - name: Publish to npm
        continue-on-error: true
        id: npm_publish
        run: pnpm publish --no-git-checks --access public
        env:
          NPM_CONFIG_PROVENANCE: true
      - name: Verify publish
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${{ steps.npm_publish.outcome }}" = "success" ]; then
            echo "Published @sendsoon/mcp@${VERSION}"
            exit 0
          fi
          if npm view "@sendsoon/mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "@sendsoon/mcp@${VERSION} already on npm; OK"
            exit 0
          fi
          echo "npm publish failed and ${VERSION} is not on the registry"
          exit 1
