name: CI & Release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assert npm and Python package versions match
        run: |
          NPM_VERSION="$(node -p "require('./npm/package.json').version")"
          PY_VERSION="$(python3 - <<'PY'
          import pathlib
          import re
          text = pathlib.Path('pypi/pyproject.toml').read_text(encoding='utf-8')
          match = re.search(r'(?m)^version = "([^"]+)"$', text)
          if not match:
              raise SystemExit('pypi/pyproject.toml version not found')
          print(match.group(1))
          PY
          )"
          SERVER_VERSION="$(node -p "require('./server.json').version")"
          NPM_PKG="$(node -p "require('./server.json').packages.find(p => p.registryType === 'npm').version")"
          PY_PKG="$(node -p "require('./server.json').packages.find(p => p.registryType === 'pypi').version")"
          echo "npm/package.json=$NPM_VERSION"
          echo "pypi/pyproject.toml=$PY_VERSION"
          echo "server.json.version=$SERVER_VERSION"
          echo "server.json.npm=$NPM_PKG"
          echo "server.json.pypi=$PY_PKG"
          test "$NPM_VERSION" = "$PY_VERSION"
          test "$NPM_VERSION" = "$SERVER_VERSION"
          test "$NPM_VERSION" = "$NPM_PKG"
          test "$NPM_VERSION" = "$PY_PKG"
      - run: pnpm run check

  check-pypi:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    uses: ./.github/workflows/pypi-check.yml

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/publish-pypi.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        # Publish the public package only — root package.json is private monorepo metadata.
        working-directory: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace deps
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Align npm package version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          export VERSION
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (pkg.private) {
            throw new Error('refusing to publish: npm/package.json must not be private');
          }
          pkg.version = version;
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          console.log('npm version ->', version);
          NODE
      - name: Publish @sendsoon/mcp to npm
        # Requires Trusted Publishers on npmjs.com for @sendsoon/mcp → GitHub Actions (sendsoon/mcp).
        # For a brand-new package name, add a Pending Publisher first, then re-run this workflow.
        continue-on-error: true
        id: npm_publish
        run: pnpm publish --no-git-checks --access public
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Verify npm publish
        run: |
          if [ "${{ steps.npm_publish.outcome }}" != "success" ]; then
            VERSION="$(node -p "require('./package.json').version")"
            if npm view "@sendsoon/mcp@${VERSION}" version >/dev/null 2>&1; then
              echo "npm already has @sendsoon/mcp@${VERSION}; continuing release."
            else
              echo "npm publish failed and version ${VERSION} is not on the registry."
              exit 1
            fi
          fi

  publish-mcp:
    # MCP Registry validates that npm/PyPI packages already exist.
    needs: [publish-npm, publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Align server.json versions with tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '
            .version = $v
            | .packages |= map(.version = $v)
          ' server.json > server.tmp.json
          mv server.tmp.json server.json

      - name: Validate MCP server manifest
        run: mcp-publisher validate

      - name: Authenticate to MCP Registry
        run: mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: mcp-publisher publish
