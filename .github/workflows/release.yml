name: CI & Release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assert npm and Python package versions match
        run: |
          NPM_VERSION="$(node -p "require('./npm/package.json').version")"
          PY_VERSION="$(python3 - <<'PY'
          import pathlib
          import re
          text = pathlib.Path('python/pyproject.toml').read_text(encoding='utf-8')
          match = re.search(r'(?m)^version = "([^"]+)"$', text)
          if not match:
              raise SystemExit('python/pyproject.toml version not found')
          print(match.group(1))
          PY
          )"
          SERVER_VERSION="$(node -p "require('./server.json').version")"
          NPM_PKG="$(node -p "require('./server.json').packages.find(p => p.registryType === 'npm').version")"
          PY_PKG="$(node -p "require('./server.json').packages.find(p => p.registryType === 'pypi').version")"
          echo "npm/package.json=$NPM_VERSION"
          echo "python/pyproject.toml=$PY_VERSION"
          echo "server.json.version=$SERVER_VERSION"
          echo "server.json.npm=$NPM_PKG"
          echo "server.json.pypi=$PY_PKG"
          test "$NPM_VERSION" = "$PY_VERSION"
          test "$NPM_VERSION" = "$SERVER_VERSION"
          test "$NPM_VERSION" = "$NPM_PKG"
          test "$NPM_VERSION" = "$PY_PKG"
      - run: pnpm run check

  check-python:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    uses: ./.github/workflows/python-check.yml

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Align npm package version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          export VERSION
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          const path = 'npm/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          console.log('npm version ->', version);
          NODE
      - name: Publish to npm
        # Requires Trusted Publishers on npmjs.com for @sendsoon/mcp → GitHub Actions (sendsoon/mcp).
        run: pnpm --filter @sendsoon/mcp publish --no-git-checks --access public
        env:
          NPM_CONFIG_PROVENANCE: true

  publish-mcp:
    # MCP Registry validates that npm/PyPI packages already exist.
    needs: publish-npm
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Align server.json versions with tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '
            .version = $v
            | .packages |= map(.version = $v)
          ' server.json > server.tmp.json
          mv server.tmp.json server.json

      - name: Validate MCP server manifest
        run: mcp-publisher validate

      - name: Authenticate to MCP Registry
        run: mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: mcp-publisher publish
